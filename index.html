<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akselov Roulette</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-1: #06040f;
    --bg-2: #100826;
    --accent-1: #8b5cf6;
    --accent-2: #ec4899;
    --accent-3: #06b6d4;
    --gold: #fbbf24;
    --text: #f5f3ff;
    --text-dim: #a1a1aa;
    --card: rgba(255, 255, 255, 0.04);
    --card-border: rgba(255, 255, 255, 0.08);
  }

  html, body {
    min-height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-1);
    color: var(--text);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(139, 92, 246, 0.35), transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(236, 72, 153, 0.25), transparent 60%),
      radial-gradient(ellipse 60% 40% at 10% 80%, rgba(6, 182, 212, 0.2), transparent 60%);
    z-index: -2;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    z-index: -1;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  /* ============ ЛОГОТИП ============ */
  .brand-logo {
    width: 66px;
    height: 66px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 27px;
    letter-spacing: -0.05em;
    color: #0a0618;
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 30%, #ec4899 65%, #8b5cf6 100%);
    box-shadow:
      0 12px 34px rgba(251, 191, 36, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.18) inset,
      0 2px 0 rgba(255, 255, 255, 0.4) inset;
    position: relative;
    margin-bottom: 18px;
    animation: brandFloat 3.4s ease-in-out infinite;
  }
  .brand-logo::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 17px;
    background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent 60%);
    pointer-events: none;
  }
  .brand-logo span {
    position: relative; z-index: 1;
    text-shadow: 0 1px 0 rgba(255,255,255,0.35);
  }
  @keyframes brandFloat {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-5px) rotate(1.5deg); }
  }

  /* ============ HEADER ============ */
  header {
    text-align: center;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeDown 0.8s ease-out;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-border);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 12px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  h1 {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, #c4b5fd 40%, #f0abfc 70%, #67e8f9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .subtitle a {
    color: var(--accent-2);
    text-decoration: none;
    font-weight: 600;
  }
  .subtitle a:hover { text-decoration: underline; }

  /* ============ REEL (спиннер) ============ */
  .reel-stage {
    position: relative;
    width: 100%;
    max-width: 920px;
    height: 220px;
    margin-bottom: 32px;
    border-radius: 26px;
    background:
      linear-gradient(180deg, rgba(139, 92, 246, 0.08), rgba(236, 72, 153, 0.05)),
      linear-gradient(160deg, #14092c 0%, #0a0620 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.5),
      0 0 60px rgba(139, 92, 246, 0.15) inset,
      0 1px 0 rgba(255, 255, 255, 0.08) inset;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 24px 0;
  }

  /* боковые маски-затухания */
  .reel-stage::before,
  .reel-stage::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 200px;
    z-index: 3;
    pointer-events: none;
  }
  .reel-stage::before {
    left: 0;
    background: linear-gradient(90deg, #0a0620 0%, #0a0620 20%, transparent 100%);
  }
  .reel-stage::after {
    right: 0;
    background: linear-gradient(270deg, #0a0620 0%, #0a0620 20%, transparent 100%);
  }

  /* красная линия-указатель по центру */
  .reel-pointer {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    background: linear-gradient(180deg, transparent, #fbbf24 15%, #fbbf24 85%, transparent);
    z-index: 5;
    box-shadow:
      0 0 16px rgba(251, 191, 36, 0.9),
      0 0 40px rgba(251, 191, 36, 0.6);
    pointer-events: none;
  }
  .reel-pointer::before,
  .reel-pointer::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    filter: drop-shadow(0 0 6px rgba(251,191,36,0.9));
  }
  .reel-pointer::before {
    top: -2px;
    border-top: 14px solid #fbbf24;
  }
  .reel-pointer::after {
    bottom: -2px;
    border-bottom: 14px solid #fbbf24;
  }

  .reel-track {
    display: flex;
    gap: 14px;
    padding: 0 8px;
    will-change: transform;
    transition: transform 7s cubic-bezier(0.12, 0.62, 0.05, 1);
  }

  .reel-item {
    flex: 0 0 150px;
    height: 156px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 10px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 4px 18px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.2s;
  }

  .reel-item::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    pointer-events: none;
    background: radial-gradient(circle at 50% 0%, var(--item-glow, rgba(139,92,246,0.5)), transparent 65%);
    opacity: 0.55;
    transition: opacity 0.3s;
  }

  .reel-item .it-icon {
    font-size: 44px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    position: relative;
    z-index: 1;
  }

  .reel-item .it-name {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1.15;
    position: relative;
    z-index: 1;
    color: var(--item-text, #fff);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    max-width: 130px;
  }

  .reel-item .it-rarity {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 3px;
    border-radius: 2px;
    background: var(--item-line, #8b5cf6);
    box-shadow: 0 0 10px var(--item-line, #8b5cf6);
    z-index: 1;
  }

  /* ============ CONTROLS ============ */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 420px;
  }

  .spin-btn {
    position: relative;
    width: 100%;
    padding: 22px 32px;
    border: none;
    border-radius: 20px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #0a0618;
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 40%, #ec4899 100%);
    cursor: pointer;
    overflow: hidden;
    box-shadow:
      0 14px 38px rgba(251,191,36,0.4),
      0 0 0 1px rgba(255,255,255,0.2) inset,
      0 2px 0 rgba(255,255,255,0.4) inset;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .spin-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    transition: left 0.7s;
  }
  .spin-btn:hover:not(:disabled)::before { left: 100%; }
  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 18px 48px rgba(251,191,36,0.55), 0 0 0 1px rgba(255,255,255,0.3) inset;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .spin-btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
    filter: grayscale(0.6);
  }

  .cooldown {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.6;
    min-height: 22px;
  }
  .cooldown strong {
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  /* ============ STATS ============ */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 640px;
    margin-top: 48px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 14px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat:hover { transform: translateY(-3px); border-color: rgba(139,92,246,0.4); }
  .stat .num {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #c4b5fd, #f0abfc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 6px;
  }

  /* ============ PRIZES LIST ============ */
  .prizes {
    margin-top: 56px;
    width: 100%;
    max-width: 780px;
  }
  .prizes h2 {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 22px;
    letter-spacing: 0.02em;
  }
  .prizes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .prize-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    backdrop-filter: blur(10px);
    transition: transform 0.2s, border-color 0.2s;
  }
  .prize-card:hover { transform: translateY(-2px); border-color: rgba(236,72,153,0.35); }
  .prize-card .ic { font-size: 26px; }
  .prize-card .tx { flex: 1; }
  .prize-card .ttl { font-weight: 700; font-size: 14px; }
  .prize-card .rr {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 700;
  }
  .rar-legendary { color: #fbbf24; }
  .rar-epic { color: #a78bfa; }
  .rar-rare { color: #60a5fa; }
  .rar-uncommon { color: #34d399; }
  .rar-common { color: #9ca3af; }

  /* ============ MODAL ============ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 3, 15, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.3s ease-out;
  }
  .overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.85) translateY(20px); }
    60% { transform: scale(1.02) translateY(-4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: linear-gradient(160deg, #1a0f35 0%, #0d0820 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 36px 28px 28px;
    text-align: center;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.6),
      0 0 100px rgba(139,92,246,0.3);
    overflow: hidden;
  }
  .modal::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(139,92,246,0.3) 10%, transparent 20%);
    animation: spinSlow 6s linear infinite;
    pointer-events: none;
    opacity: 0.5;
  }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  .modal > * { position: relative; z-index: 1; }

  .modal .mini-brand {
    width: 46px;
    height: 46px;
    margin: 0 auto 14px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 19px;
    letter-spacing: -0.05em;
    color: #0a0618;
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 35%, #ec4899 70%, #8b5cf6 100%);
    box-shadow:
      0 6px 20px rgba(251,191,36,0.4),
      0 0 0 1px rgba(255,255,255,0.2) inset,
      0 1px 0 rgba(255,255,255,0.35) inset;
  }

  .modal .ico {
    font-size: 62px;
    line-height: 1;
    margin-bottom: 10px;
    display: inline-block;
    filter: drop-shadow(0 0 24px rgba(251,191,36,0.6));
    animation: bounce 1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .modal .ico.sad { animation: none; filter: none; opacity: 0.85; }

  .modal .rarity-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.05);
  }

  .modal h3 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 10px;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .modal p {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .modal .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .modal .btn-primary {
    color: #0a0618;
    background: linear-gradient(135deg, #fbbf24, #ec4899);
    box-shadow: 0 8px 24px rgba(251,191,36,0.4);
    margin-bottom: 10px;
  }
  .modal .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(251,191,36,0.55);
  }
  .modal .btn-secondary {
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--card-border);
    text-transform: none;
    font-weight: 600;
    letter-spacing: 0;
  }
  .modal .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

  .confetti {
    position: absolute;
    width: 8px;
    height: 14px;
    top: 0;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .overlay.show .confetti { animation: confettiFall 2.5s ease-out forwards; }
  @keyframes confettiFall {
    0% { top: -20px; opacity: 1; transform: rotate(0deg); }
    100% { top: 110%; opacity: 0; transform: rotate(720deg); }
  }

  footer {
    margin-top: 64px;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  footer a {
    color: var(--accent-2);
    text-decoration: none;
    font-weight: 600;
  }
  footer a:hover { text-decoration: underline; }

  .footer-brand {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .footer-brand .mini {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 11px;
    color: #0a0618;
    background: linear-gradient(135deg, #fbbf24, #ec4899 70%, #8b5cf6);
    letter-spacing: -0.05em;
  }

  @media (max-width: 640px) {
    .wrap { padding: 20px 14px 60px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:last-child { grid-column: span 2; }
    .modal { padding: 30px 20px 24px; }
    .modal h3 { font-size: 22px; }
    .brand-logo { width: 54px; height: 54px; font-size: 22px; border-radius: 16px; }
    .reel-stage { height: 180px; padding: 18px 0; }
    .reel-item { flex: 0 0 120px; height: 130px; }
    .reel-item .it-icon { font-size: 34px; }
    .reel-item .it-name { font-size: 10px; max-width: 100px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-logo"><span>Аа</span></div>
    <div class="badge"><span class="dot"></span> Онлайн • Работает сейчас</div>
    <h1>Akselov Roulette</h1>
    <p class="subtitle">
      Крути раз в 3 дня и выбивай подарки от
      <a href="https://t.me/akselovvv" target="_blank" rel="noopener">@akselovvv</a>:
      Telegram Gifts, звёзды, Premium, теги и админка.
    </p>
  </header>

  <div class="reel-stage">
    <div class="reel-track" id="reelTrack"></div>
    <div class="reel-pointer"></div>
  </div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn">Крутить рулетку</button>
    <div class="cooldown" id="cooldown"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="statSpins">0</div>
      <div class="lbl">Круток сделано</div>
    </div>
    <div class="stat">
      <div class="num" id="statWins">0</div>
      <div class="lbl">Призов выбито</div>
    </div>
    <div class="stat">
      <div class="num" id="statBest">—</div>
      <div class="lbl">Лучший приз</div>
    </div>
  </div>

  <section class="prizes">
    <h2>🎯 Что можно выбить</h2>
    <div class="prizes-grid" id="prizesGrid"></div>
  </section>

  <footer>
    <span class="footer-brand">
      <span class="mini">Аа</span>
      <span>Сделано для <a href="https://t.me/akselovvv" target="_blank" rel="noopener">@akselovvv</a></span>
    </span>
    <span>· Крути раз в 3 дня</span>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* =========================================================
   ПРИЗЫ
   ========================================================= */
const PRIZES = [
  { id: 'akselov_gift', emoji: '🎁', name: 'Подарок от Акселова', title: 'ГЛАВНЫЙ ПРИЗ',       desc: 'Настоящий подарок от Акселова лично. Пиши в Telegram — обсудим и отправлю.', rarity: 'legendary', weight: 0.40, glow: 'rgba(251,191,36,0.55)', line: '#fbbf24', text: '#fed7aa', isWin: true },
  { id: 'signa',        emoji: '💠', name: 'Сигна от Акселова',   title: 'Сигна твоя!',         desc: 'Личная сигна от Акселова. Пиши в Telegram — заберёшь.',                       rarity: 'legendary', weight: 0.25, glow: 'rgba(6,182,212,0.55)',  line: '#22d3ee', text: '#a5f3fc', isWin: true },
  { id: 'premium',      emoji: '💎', name: 'Premium на месяц',    title: 'Telegram Premium!',   desc: 'Premium на 1 месяц — пиши @akselovvv, отправлю в ближайшее время.',            rarity: 'epic',      weight: 0.20, glow: 'rgba(139,92,246,0.55)', line: '#a78bfa', text: '#ddd6fe', isWin: true },
  { id: 'bear',         emoji: '🧸', name: 'Мишка',               title: 'Мишка в студию!',     desc: 'Милый мишка от Акселова. Пиши в Telegram — передам подарок.',                 rarity: 'epic',      weight: 0.15, glow: 'rgba(217,119,6,0.5)',  line: '#f59e0b', text: '#fed7aa', isWin: true },
  { id: 'rose',         emoji: '🌹', name: 'Роза',                title: 'Красная роза',        desc: 'Роза от Акселова — забирай через Telegram.',                                  rarity: 'rare',      weight: 0.15, glow: 'rgba(190,18,60,0.5)',  line: '#f43f5e', text: '#fecdd3', isWin: true },
  { id: 'heart',        emoji: '❤️', name: 'Сердечко',            title: 'Сердечко тебе!',      desc: 'Сердечко от Акселова. Пиши в Telegram — заберёшь.',                           rarity: 'rare',      weight: 0.15, glow: 'rgba(225,29,72,0.5)',  line: '#fb7185', text: '#fecdd3', isWin: true },
  { id: 'tag',          emoji: '🏷️', name: 'Тег в чате',          title: 'Красивый тег',        desc: 'Выдаю уникальный тег в чате раздач. Пиши @akselovvv — сделаем.',              rarity: 'uncommon',  weight: 0.10, glow: 'rgba(5,150,105,0.5)',  line: '#10b981', text: '#a7f3d0', isWin: true },
  { id: 'admin',        emoji: '👑', name: 'Админка в группе',    title: 'Ты админ!',           desc: 'Выдаю админку в группе. Пиши в Telegram — настроим и выдадим.',               rarity: 'uncommon',  weight: 0.05, glow: 'rgba(29,78,216,0.5)',  line: '#3b82f6', text: '#bfdbfe', isWin: true },
  { id: 'subscribe',    emoji: '📢', name: 'Подписка на ТГК',     title: 'Ты в клубе!',         desc: 'Подписка на канал Акселова. Пиши @akselovvv — добавлю.',                      rarity: 'uncommon',  weight: 0.05, glow: 'rgba(14,116,144,0.5)', line: '#0891b2', text: '#a5f3fc', isWin: true },

  { id: 'nothing',      emoji: '🌫️', name: 'Ничего',              title: 'Повезёт в следующий раз', desc: 'Сегодня не твой день. Возвращайся через 3 дня — рулетка любит терпеливых.',    rarity: 'common',    weight: 98.5, glow: 'rgba(100,100,120,0.3)',line: '#52525b', text: '#a1a1aa', isWin: false },
];

const RARITY_LABEL = {
  common: 'Обычный',
  uncommon: 'Необычный',
  rare: 'Редкий',
  epic: 'Эпический',
  legendary: 'ЛЕГЕНДАРНЫЙ',
};

const TG_LINK = 'https://t.me/akselovvv';
const COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000;
const LS_KEY = 'akselov_roulette_v3';

/* =========================
   STATE
   ========================= */
let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { lastSpin: 0, spins: 0, wins: 0, bestPrizeId: null, bestRarityRank: -1 };
}
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* =========================
   REEL
   ========================= */
const reelTrack = document.getElementById('reelTrack');
const ITEM_W = 150;      // ширина карточки
const ITEM_GAP = 14;     // gap между карточками
const ITEM_TOTAL = ITEM_W + ITEM_GAP;
const REEL_LENGTH = 60;  // сколько карточек в ленте
const WINNER_POS = 55;   // позиция выигрышной карточки в ленте

function buildReelItem(prize) {
  const el = document.createElement('div');
  el.className = 'reel-item';
  el.style.setProperty('--item-glow', prize.glow);
  el.style.setProperty('--item-line', prize.line);
  el.style.setProperty('--item-text', prize.text);
  el.innerHTML = `
    <div class="it-icon">${prize.emoji}</div>
    <div class="it-name">${prize.name}</div>
    <div class="it-rarity"></div>
  `;
  return el;
}

function pickPrizeIndex() {
  const total = PRIZES.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < PRIZES.length; i++) {
    r -= PRIZES[i].weight;
    if (r <= 0) return i;
  }
  return PRIZES.length - 1;
}

function buildReel(winnerIdx) {
  reelTrack.innerHTML = '';
  for (let i = 0; i < REEL_LENGTH; i++) {
    let idx;
    if (i === WINNER_POS) {
      idx = winnerIdx;
    } else {
      // Фон — визуальный микс призов и "ничего"
      idx = Math.floor(Math.random() * PRIZES.length);
    }
    reelTrack.appendChild(buildReelItem(PRIZES[idx]));
  }
}

/* =========================
   SPIN
   ========================= */
let spinning = false;
const spinBtn = document.getElementById('spinBtn');
const cooldownEl = document.getElementById('cooldown');

function spin() {
  if (spinning) return;
  const now = Date.now();
  if (now - state.lastSpin < COOLDOWN_MS) return;

  spinning = true;
  spinBtn.disabled = true;

  const idx = pickPrizeIndex();
  buildReel(idx);

  // Сбросим позицию без анимации
  reelTrack.style.transition = 'none';
  reelTrack.style.transform = 'translateX(0)';

  // Дать браузеру применить, затем — плавная анимация
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const stage = reelTrack.parentElement;
      const stageW = stage.clientWidth;
      const center = stageW / 2;
      const winnerCenter = WINNER_POS * ITEM_TOTAL + ITEM_W / 2;
      // Небольшой случайный сдвиг в пределах ±25px, чтобы не всегда идеально в центр
      const jitter = (Math.random() - 0.5) * 50;
      const target = -(winnerCenter - center + jitter);

      reelTrack.style.transition = 'transform 7s cubic-bezier(0.12, 0.62, 0.05, 1)';
      reelTrack.style.transform = `translateX(${target}px)`;

      setTimeout(() => {
        spinning = false;
        onResult(idx);
      }, 7100);
    });
  });
}

function onResult(idx) {
  const prize = PRIZES[idx];

  state.lastSpin = Date.now();
  state.spins += 1;

  const rarityRank = { common: 0, uncommon: 1, rare: 2, epic: 3, legendary: 4 }[prize.rarity];

  if (prize.isWin) {
    state.wins += 1;
    if (rarityRank > state.bestRarityRank) {
      state.bestRarityRank = rarityRank;
      state.bestPrizeId = prize.id;
    }
  }

  saveState();
  renderStats();
  renderCooldown();
  showModal(prize);
}

/* =========================
   MODAL
   ========================= */
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

function showModal(prize) {
  const rarityClass = `rar-${prize.rarity}`;

  let buttonsHTML;
  if (prize.isWin) {
    buttonsHTML = `
      <a class="btn btn-primary" href="${TG_LINK}" target="_blank" rel="noopener">
        🎁 Получить подарок
      </a>
      <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
    `;
  } else {
    buttonsHTML = `
      <button class="btn btn-primary" onclick="closeModal()">
        Повезёт в следующий раз
      </button>
    `;
  }

  modal.innerHTML = `
    <div class="mini-brand">Аа</div>
    <div class="ico ${prize.isWin ? '' : 'sad'}">${prize.emoji}</div>
    <div class="rarity-tag ${rarityClass}">${RARITY_LABEL[prize.rarity]}</div>
    <h3>${prize.title}</h3>
    <p>${prize.desc}</p>
    ${buttonsHTML}
  `;

  overlay.classList.add('show');

  if (prize.isWin) spawnConfetti(prize.rarity);
}

function spawnConfetti(rarity) {
  const count = rarity === 'legendary' ? 60 : rarity === 'epic' ? 40 : 20;
  const colors = rarity === 'legendary'
    ? ['#fbbf24', '#f59e0b', '#ec4899', '#fde68a']
    : ['#8b5cf6', '#ec4899', '#06b6d4', '#a78bfa'];

  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = (Math.random() * 0.6) + 's';
    c.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    modal.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function closeModal() { overlay.classList.remove('show'); }
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* =========================
   COOLDOWN
   ========================= */
function formatCooldown(ms) {
  const totalSec = Math.floor(ms / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const parts = [];
  if (d) parts.push(`${d} д`);
  if (d || h) parts.push(`${h} ч`);
  if (d || h || m) parts.push(`${m} м`);
  parts.push(`${s} с`);
  return parts.join(' ');
}

function renderCooldown() {
  const left = COOLDOWN_MS - (Date.now() - state.lastSpin);
  if (left > 0) {
    spinBtn.disabled = true;
    spinBtn.textContent = 'Подожди…';
    cooldownEl.innerHTML = `Следующая крутка через <strong>${formatCooldown(left)}</strong>`;
  } else {
    spinBtn.disabled = false;
    spinBtn.textContent = 'Крутить рулетку';
    cooldownEl.innerHTML = `Рулетка доступна! Крути и забирай приз 🎁`;
  }
}
setInterval(renderCooldown, 1000);

/* =========================
   STATS
   ========================= */
function renderStats() {
  document.getElementById('statSpins').textContent = state.spins;
  document.getElementById('statWins').textContent = state.wins;

  const best = state.bestPrizeId ? PRIZES.find((p) => p.id === state.bestPrizeId) : null;
  const bestEl = document.getElementById('statBest');
  if (best) {
    bestEl.textContent = `${best.emoji} ${best.name}`;
    bestEl.style.fontSize = '14px';
  } else {
    bestEl.textContent = '—';
    bestEl.style.fontSize = '26px';
  }
}

/* =========================
   PRIZES LIST
   ========================= */
function renderPrizesList() {
  const grid = document.getElementById('prizesGrid');
  grid.innerHTML = '';
  PRIZES.filter((p) => p.isWin).forEach((p) => {
    const el = document.createElement('div');
    el.className = 'prize-card';
    el.innerHTML = `
      <div class="ic">${p.emoji}</div>
      <div class="tx">
        <div class="ttl">${p.name}</div>
        <div class="rr rar-${p.rarity}">${RARITY_LABEL[p.rarity]}</div>
      </div>
    `;
    grid.appendChild(el);
  });
}

/* =========================
   INIT
   ========================= */
// Заполним ленту нейтральным превью (без победителя)
buildReel(0);
// Сбросим позицию так, чтобы сразу было видно середину ленты
reelTrack.style.transition = 'none';
reelTrack.style.transform = 'translateX(-100px)';

renderPrizesList();
renderStats();
renderCooldown();

spinBtn.addEventListener('click', spin);

// На случай ресайза — пересоберём позицию (без анимации)
window.addEventListener('resize', () => {
  if (!spinning) {
    reelTrack.style.transition = 'none';
  }
});
</script>
